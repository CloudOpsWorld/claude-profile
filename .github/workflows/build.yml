name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: pytest -v

  build-binaries:
    name: Build ${{ matrix.artifact_name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: claude-profile-linux-amd64
            binary: claude-profile
          - os: macos-latest
            artifact_name: claude-profile-macos-arm64
            binary: claude-profile
          - os: windows-latest
            artifact_name: claude-profile-windows-amd64.exe
            binary: claude-profile.exe
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build binary
        run: pyinstaller --onefile --name claude-profile --clean --paths . scripts/claude_profile_entry.py

      - name: Test binary
        env:
          CLAUDE_PROFILE_HOME: ${{ runner.temp }}/claude-profile-smoke
        run: |
          chmod +x dist/${{ matrix.binary }}
          ./dist/${{ matrix.binary }} --version
          ./dist/${{ matrix.binary }} help
          ./dist/${{ matrix.binary }} add smoke --provider claude --no-bind
          ./dist/${{ matrix.binary }} list | grep smoke

      - name: Rename binary
        run: mv dist/${{ matrix.binary }} dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 7

  build-package:
    name: Build Python package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
          retention-days: 7
