[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-profile"
version = "1.0.2"
description = "Per-customer profiles for Claude Code and Claude Desktop: separate logins, AI platforms, MCP servers, skills and history, side by side."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "claude-profile contributors" }]
keywords = ["claude", "claude-code", "claude-desktop", "anthropic", "profiles", "mcp", "deepseek", "openrouter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CloudOpsWorld/claude-profile"
Repository = "https://github.com/CloudOpsWorld/claude-profile"
Issues = "https://github.com/CloudOpsWorld/claude-profile/issues"

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "ruff>=0.15.21", "mypy>=2.3.0", "build>=1.5.1"]

[project.scripts]
claudectl = "claudectl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["claudectl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pragmatic default rule set; the CI lint job is advisory.
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741", "E731"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
